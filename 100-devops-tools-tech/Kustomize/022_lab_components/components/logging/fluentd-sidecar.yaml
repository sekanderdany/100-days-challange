apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  template:
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd:latest
        env:
        - name: FLUENT_UID
          value: "0"
        - name: FLUENTD_CONF
          value: fluent.conf
        volumeMounts:
        - name: logs
          mountPath: /var/log
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: logs
        emptyDir: {}
