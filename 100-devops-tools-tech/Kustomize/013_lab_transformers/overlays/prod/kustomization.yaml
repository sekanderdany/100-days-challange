apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: production

namePrefix: prod-
nameSuffix: -v1

commonLabels:
  environment: production
  team: platform-team
  criticality: high

commonAnnotations:
  deployed-by: kustomize
  env-type: production
  monitoring: enabled
  backup: enabled

replicas:
- name: api
  count: 10
- name: redis
  count: 3

images:
- name: nginx
  newName: prodregistry.io/api
  newTag: "1.21"
- name: redis
  newName: prodregistry.io/redis
  newTag: "7.0"
