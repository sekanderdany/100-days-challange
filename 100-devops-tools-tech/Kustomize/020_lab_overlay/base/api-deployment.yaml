apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: ecommerce
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce
      component: api
  template:
    metadata:
      labels:
        app: ecommerce
        component: api
    spec:
      containers:
      - name: api
        image: nginx:1.19
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
